[package]
name = "vegas_sync_core"
version = "0.2.0"
edition = "2021"
authors = ["Antigravity Audio Sync Engine"]
description = "High-Performance Native Audio Synchronization Core for VEGAS Pro"

[lib]
name = "telltale_sync_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
rustfft = "6.2"
realfft = "3.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
